function b64(s){const bin=atob(s);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
async function unlock(password){
  const raw=b64(DATA);
  const salt=raw.slice(0,16), iv=raw.slice(16,28), ct=raw.slice(28);
  const base=await crypto.subtle.importKey("raw", new TextEncoder().encode(password), "PBKDF2", false, ["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2", salt:salt, iterations:250000, hash:"SHA-256"}, base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const plain=await crypto.subtle.decrypt({name:"AES-GCM", iv:iv}, key, ct);
  const html=new TextDecoder().decode(plain);
  sessionStorage.setItem("pdld_pw", password);
  document.open(); document.write(html); document.close();
}
document.getElementById("f").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const v=document.getElementById("pw").value;
  try{ await unlock(v); }catch(_){ document.getElementById("err").textContent="パスワードが違います。"; }
});
const saved=sessionStorage.getItem("pdld_pw");
if(saved){ unlock(saved).catch(()=>{ sessionStorage.removeItem("pdld_pw"); }); }
