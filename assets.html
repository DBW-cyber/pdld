async function unlock(pw) {
  const raw = Uint8Array.from(atob(DATA), c => c.charCodeAt(0));
  const salt = raw.slice(0,16), iv = raw.slice(16,28), ct = raw.slice(28);
  const km = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:250000, hash:'SHA-256'}, km, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv}, key, ct);
  return new TextDecoder().decode(pt);
}
async function go(pw) {
  try {
    const html = await unlock(pw);
    sessionStorage.setItem('pdld_pw', pw);
    document.getElementById('lock').style.display = 'none';
    const app = document.getElementById('app'); app.style.display = 'block'; app.innerHTML = html;
    window.scrollTo(0,0);
  } catch(e) { document.getElementById('err').textContent = 'パスワードが違います'; }
}
document.getElementById('btn').addEventListener('click', () => go(document.getElementById('pw').value.trim()));
document.getElementById('pw').addEventListener('keydown', e => { if (e.key === 'Enter') go(e.target.value.trim()); });
const saved = sessionStorage.getItem('pdld_pw'); if (saved) go(saved);
</script></body></html>
